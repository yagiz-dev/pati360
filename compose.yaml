services:
  postgres:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pati}
      POSTGRES_USER: ${POSTGRES_USER:-pati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?You must set a POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432'

volumes:
  postgres-data: